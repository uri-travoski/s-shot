app-id: io.github.uri_travoski.s-shot
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: s-shot
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-pictures
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-1-1
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: s-shot
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/uri-travoski/s-shot/archive/refs/tags/v1.29.tar.gz
        sha256: 3d0801a0f3b96d81b4322b5b66acad5ae0fabd00fbd5e6ae1a4c8775841ec5b5
