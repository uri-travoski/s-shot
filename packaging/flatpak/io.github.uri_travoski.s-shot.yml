app-id: io.github.uri_travoski.s-shot
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: s-shot
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-pictures
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-1-*
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: s-shot
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/uri-travoski/s-shot/archive/refs/tags/v1.29.tar.gz
        sha256: 049faedc3cb9909908dc06fc15d9eac80a6d5562b9270e6a8c6f153db8f7bbca
