name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb-rpm-appimage:
    name: Build DEB, RPM & AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            qt6-base-dev \
            qt6-svg-dev \
            libx11-dev \
            libxtst-dev \
            rpm \
            file \
            wget

      - name: Configure and build S-Shot
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package DEB and RPM
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM
          cd ..
          mkdir -p dist
          mv build/*.deb dist/
          mv build/*.rpm dist/
          dpkg-deb -I dist/*.deb

      - name: Build AppImage
        run: |
          DESTDIR=AppDir cmake --install build
          mkdir -p AppDir/usr/share/metainfo
          cp resources/io.github.uri_travoski.s-shot.metainfo.xml AppDir/usr/share/metainfo/
          cp resources/org.sshot.s-shot.metainfo.xml AppDir/usr/share/metainfo/

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          ./linuxdeploy-x86_64.AppImage --appimage-extract
          ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-root

          export QMAKE=/usr/lib/qt6/bin/qmake
          export PATH="$(pwd)/linuxdeploy-root/usr/bin:$PATH"
          ./linuxdeploy-root/usr/bin/linuxdeploy \
            --appdir AppDir \
            -e AppDir/usr/bin/s-shot \
            -i resources/icons/s-shot.svg \
            -d resources/s-shot.desktop \
            --output appimage

          # Clean tool AppImages and keep only S-Shot
          rm -rf linuxdeploy* squashfs-root AppDir
          mv S-Shot*.AppImage dist/

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: dist/*.deb

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: package-rpm
          path: dist/*.rpm

      - name: Upload AppImage package
        uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: dist/*.AppImage

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils

      - name: Build Flatpak bundle
        run: |
          VERSION=$(sed -n '/project/,/)/p' CMakeLists.txt | grep 'VERSION' | awk '{print $2}')
          echo "Building Flatpak bundle for version ${VERSION}..."
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform/x86_64/6.8 org.kde.Sdk/x86_64/6.8
          flatpak-builder --user --force-clean --repo=repo build io.github.uri_travoski.s-shot.yml
          flatpak build-bundle repo "io.github.uri_travoski.s-shot-${VERSION}.flatpak" io.github.uri_travoski.s-shot
          flatpak build-bundle repo "s-shot-${VERSION}.flatpak" io.github.uri_travoski.s-shot

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-flatpak
          path: "*.flatpak"

  publish-release:
    name: Publish Release Assets
    needs: [build-deb-rpm-appimage, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: S-Shot ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
